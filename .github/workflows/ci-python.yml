name: CI Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          cache: true

      - name: Install TeX Live 2026
        uses: zauguin/install-texlive@6671d0c62046c7e349fe154d5208fe746b07e037  # v4.4.0
        with:
          texlive_version: 2026
          package_file: tex/packages.txt

      - name: Install Python workspace
        run: just setup-ci

      - name: Compile fixture PDFs
        run: just latex-smoke

      - name: Format, lint, typecheck, test
        run: |
          uv run ruff format --check apps packages/python scripts
          just lint-python
          just typecheck-python
          just test-python
