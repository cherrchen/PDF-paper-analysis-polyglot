<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Paper Analysis</title>
    <link rel="stylesheet" href="/src/viewer.css" />
  </head>
  <body>
    <main>
      <h1 id="title">PDF Paper Analysis</h1>
      <p id="status">loading</p>
      <section id="viewer" hidden>
        <div id="panes">
          <figure class="pane" id="source-pane">
            <figcaption>Source</figcaption>
            <canvas id="source-canvas"></canvas>
          </figure>
          <figure class="pane" id="target-pane">
            <figcaption>Target</figcaption>
            <canvas id="target-canvas"></canvas>
          </figure>
        </div>
        <p id="viewer-status"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
