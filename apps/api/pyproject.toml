[project]
name = "paper-api"
version = "0.0.0"
description = "HTTP API runtime entry point. Reusable logic belongs in packages/."
readme = "README.md"
license = { text = "MIT with Non-Commercial additional terms (see LICENSE)" }
requires-python = ">=3.13,<3.14"
authors = [{ name = "PDF Paper Analysis contributors" }]
dependencies = [
  "document-model",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_api"]

[tool.uv.sources]
document-model = { workspace = true }
