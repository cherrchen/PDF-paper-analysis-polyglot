[project]
name = "paper-llm"
version = "0.0.0"
description = "LLM integration helpers. Reusable logic lives here, not in apps/."
readme = "README.md"
license = { text = "MIT with Non-Commercial additional terms (see LICENSE)" }
requires-python = ">=3.13,<3.14"
authors = [{ name = "PDF Paper Analysis contributors" }]
dependencies = ["document-model"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_llm"]

[tool.uv.sources]
document-model = { workspace = true }
