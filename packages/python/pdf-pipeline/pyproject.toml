[project]
name = "pdf-pipeline"
version = "0.0.0"
description = "PDF ingestion and reconstruction pipeline. Reusable Python logic lives here, not in apps/."
readme = "README.md"
license = { text = "MIT with Non-Commercial additional terms (see LICENSE)" }
requires-python = ">=3.13,<3.14"
authors = [{ name = "PDF Paper Analysis contributors" }]
dependencies = ["document-model", "paper-llm", "pypdfium2>=4.30,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_pipeline"]

[project.optional-dependencies]
# Live parser CLIs/services are optional and env-driven. Extra names document
# the groups; they do not pull MinerU/Docling/Torch/GROBID into the lockfile.
# Set MINERU_CMD / DOCLING_CMD / GROBID_URL locally. Dump adapters need none.
mineru = []
docling = []
grobid = []

[tool.uv.sources]
document-model = { workspace = true }
paper-llm = { workspace = true }
