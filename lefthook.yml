pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    ruff-lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    biome:
      glob: "*.{js,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    rustfmt:
      glob: "*.rs"
      run: cargo fmt -- {staged_files}
      stage_fixed: true
    typos:
      glob: "*.{md,py,ts,tsx,js,rs,toml,yml,yaml,tex}"
      run: typos {staged_files}
    bilingual-docs:
      glob: "*.md"
      run: uv run python scripts/verify_bilingual_docs.py
    agent-notes:
      glob: ".agents/notes/**/*.md"
      run: uv run python scripts/verify_agent_notes.py
    git-check:
      run: git diff --cached --check

commit-msg:
  commands:
    conventional:
      run: uv run python scripts/commit_msg.py {1}

pre-push:
  commands:
    check-fast:
      run: just check-fast
